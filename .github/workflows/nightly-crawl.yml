name: Nightly crawl

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # --tax needs an interactive Portal das Financas login, so it stays a manual step.
      - name: Crawl public auction listings
        continue-on-error: true
        timeout-minutes: 30
        run: python3 scripts/auction_finder.py --crawl --db house_finder.db

      - name: Crawl market listings
        run: python3 scripts/market_crawler.py --db house_finder.db

      - name: Build report
        run: python3 scripts/build_report.py --db house_finder.db --output index.html

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html house_finder.db
          git diff --cached --quiet || git commit -m "Update index.html and database from nightly crawl"
          git pull --rebase
          git push
